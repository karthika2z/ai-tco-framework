server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /calculator/methodology {
        try_files /calculator/methodology/index.html =404;
    }

    location = /calculator/methodology/ {
        try_files /calculator/methodology/index.html =404;
    }

    location = /calculator {
        try_files /calculator/index.html =404;
    }

    location = /calculator/ {
        try_files /calculator/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
}
